# Configuración de despliegue para Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Los recursos con hash en el nombre (JS y CSS que genera Vite) nunca
# cambian de contenido para una misma URL: se cachean para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Los favicons sí pueden cambiar conservando el nombre. Se cachean un día
# y luego se revalidan, para que una actualización llegue pronto sin
# pedir el archivo en cada visita.
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/android-chrome-*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/maskable-*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400, must-revalidate"

# El HTML se revalida siempre: es lo que enlaza a los recursos versionados.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
